name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  campusloop-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          test -f README.md
          test -f vercel-demo/index.html
          test -f vercel-demo/vercel.json
          test -f vercel-demo/static/styles/styles.css
          test -f vercel-demo/static/icons/CampusLoop_UserLogo.png
          test -f src/frontend/templates/home.html
          test -f src/frontend/templates/product.html
          test -f src/frontend/templates/signin.html
          test -f src/frontend/templates/post-item.html
          test -f src/productcatalogservice/products.json
          test -f release/kubernetes-manifests.yaml

      - name: Check README links
        run: |
          grep -q "https://neuloop.vercel.app" README.md
          grep -q "vercel-demo" README.md
          grep -q "CampusLoop" README.md

  marketplace-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: campusloop
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: campusloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U campusloop -d campusloop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: |
            src/marketplaceservice/go.sum
            src/frontend/go.sum
      - name: Test PostgreSQL transactions and concurrency
        working-directory: src/marketplaceservice
        env:
          TEST_DATABASE_URL: postgres://campusloop:ci-only-password@127.0.0.1:5432/campusloop_test?sslmode=disable
        run: go test -race -count=1 ./...
      - name: Test frontend integration
        working-directory: src/frontend
        run: go test ./...
