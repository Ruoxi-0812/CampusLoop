{{ define "post-item" }}
{{ template "header" . }}
<main role="main" class="campusloop-dashboard-page campusloop-post-page">
  <section class="campusloop-dashboard-card">
    <div class="campusloop-dashboard-header">
      <div>
        <p class="campusloop-eyebrow">Student seller</p>
        <h1>Post an item</h1>
      </div>
      <a href="{{ $.baseUrl }}/my-listings" class="campusloop-button campusloop-button-secondary">My listings</a>
    </div>

    <form id="campusloop-post-form" class="campusloop-post-form">
      <label class="campusloop-form-wide">
        Item photo
        <input name="image" type="file" accept="image/*">
      </label>
      <label>
        Title
        <input name="name" type="text" placeholder="Desk lamp, calculus textbook, mini fridge..." required>
      </label>
      <label>
        Category
        <select name="category" required>
          <option value="textbooks">Textbooks</option>
          <option value="furniture">Furniture</option>
          <option value="dorm">Dorm</option>
          <option value="electronics">Electronics</option>
          <option value="clothing">Clothing</option>
          <option value="transportation">Transportation</option>
          <option value="essentials">Essentials</option>
          <option value="other">Other</option>
        </select>
      </label>
      <label>
        Price
        <input name="price" type="number" min="0" step="1" placeholder="25" required>
      </label>
      <label>
        Status
        <select name="status" required>
          <option value="Available">Available</option>
          <option value="Reserved">Reserved</option>
          <option value="Sold">Sold</option>
        </select>
      </label>
      <label>
        City
        <input name="city" type="text" value="Boston" required>
      </label>
      <label>
        Campus
        <select name="campus" required>
          <option value="Northeastern University - Boston">Northeastern University - Boston</option>
          <option value="Northeastern University - Oakland">Northeastern University - Oakland</option>
          <option value="Northeastern University - Seattle">Northeastern University - Seattle</option>
          <option value="Northeastern University - Vancouver">Northeastern University - Vancouver</option>
        </select>
      </label>
      <label>
        Dorm area or neighborhood
        <input name="dorm" type="text" placeholder="LightView, IV, West Village, Mission Hill..." required>
      </label>
      <label>
        Recommended pickup spot
        <select name="pickup" required>
          <option value="Snell Library lobby">Snell Library lobby</option>
          <option value="Curry Student Center entrance">Curry Student Center entrance</option>
          <option value="ISEC lobby">ISEC lobby</option>
          <option value="Marino Recreation Center entrance">Marino Recreation Center entrance</option>
          <option value="Ruggles Station entrance">Ruggles Station entrance</option>
          <option value="LightView lobby">LightView lobby</option>
        </select>
      </label>
      <label class="campusloop-form-wide">
        Pickup address or notes
        <input name="address" type="text" placeholder="Meet inside lobby; exact dorm room shared after purchase" required>
      </label>
      <label>
        Contact method
        <input name="contact" type="text" placeholder="Email, phone, Instagram..." required>
      </label>
      <label>
        Available handoff time
        <input name="handoff" type="text" placeholder="Weekdays after 5pm, Sunday afternoon..." required>
      </label>
      <label class="campusloop-form-wide">
        Description
        <input name="description" type="text" placeholder="Condition, included accessories, original price, notes..." required>
      </label>
      <button type="submit" class="campusloop-button campusloop-button-primary">Save listing</button>
    </form>
  </section>
</main>

<script>
  (function () {
    if (!window.CampusLoopAuth || !window.CampusLoopAuth.getUser()) {
      window.location.href = '{{ $.baseUrl }}/login?next={{ $.baseUrl }}/post-item';
      return;
    }
    const postForm = document.getElementById('campusloop-post-form');
    const listingsStorageKey = 'campusloop-my-listings';
    if (!postForm) {
      return;
    }

    function normalizeCategory(category) {
      return (category || 'all').trim().toLowerCase();
    }

    function getStoredListings() {
      try {
        return JSON.parse(window.localStorage.getItem(listingsStorageKey)) || [];
      } catch (error) {
        return [];
      }
    }

    function saveStoredListings(listings) {
      window.localStorage.setItem(listingsStorageKey, JSON.stringify(listings));
    }

    function readImageFile(file) {
      return new Promise(function (resolve) {
        if (!file) {
          resolve('');
          return;
        }
        const reader = new FileReader();
        reader.onload = function () {
          resolve(String(reader.result || ''));
        };
        reader.onerror = function () {
          resolve('');
        };
        reader.readAsDataURL(file);
      });
    }

    postForm.addEventListener('submit', async function (event) {
      event.preventDefault();
      const formData = new FormData(postForm);
      const category = normalizeCategory(formData.get('category'));
      const categoryOption = postForm.querySelector('option[value="' + category + '"]');
      const imageFile = postForm.elements.image && postForm.elements.image.files ? postForm.elements.image.files[0] : null;
      const listing = {
        id: String(Date.now()),
        name: String(formData.get('name') || '').trim(),
        category: category,
        categoryLabel: categoryOption ? categoryOption.textContent : category,
        price: String(formData.get('price') || '0').trim(),
        status: String(formData.get('status') || 'Available').trim(),
        city: String(formData.get('city') || '').trim(),
        campus: String(formData.get('campus') || '').trim(),
        dorm: String(formData.get('dorm') || '').trim(),
        pickup: String(formData.get('pickup') || '').trim(),
        address: String(formData.get('address') || '').trim(),
        contact: String(formData.get('contact') || '').trim(),
        handoff: String(formData.get('handoff') || '').trim(),
        description: String(formData.get('description') || '').trim(),
        image: await readImageFile(imageFile)
      };
      const listings = getStoredListings();
      listings.unshift(listing);
      saveStoredListings(listings);
      window.location.href = '{{ $.baseUrl }}/my-listings';
    });
  }());
</script>
{{ template "footer" . }}
{{ end }}
