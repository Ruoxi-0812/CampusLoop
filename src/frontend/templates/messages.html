{{ define "messages" }}
{{ template "header" . }}
<main role="main" class="campusloop-dashboard-page">
  <section class="campusloop-dashboard-card">
    <div class="campusloop-dashboard-header">
      <div>
        <p class="campusloop-eyebrow">Messages</p>
        <h1>Seller chats</h1>
      </div>
      <a href="{{ $.baseUrl }}/" class="campusloop-button campusloop-button-secondary">Browse items</a>
    </div>
    <div class="campusloop-messages-list" data-messages-page-list></div>
    <p class="campusloop-empty-listings" data-empty-messages>No messages yet.</p>
  </section>
</main>

<script>
  (function () {
    if (!window.CampusLoopAuth || !window.CampusLoopAuth.getUser()) {
      window.location.href = '{{ $.baseUrl }}/login?next={{ $.baseUrl }}/messages';
      return;
    }
    const list = document.querySelector('[data-messages-page-list]');
    const empty = document.querySelector('[data-empty-messages]');
    if (!list || !empty) {
      return;
    }

    function getStoredMessages() {
      try {
        return JSON.parse(window.localStorage.getItem('campusloop-messages')) || [];
      } catch (error) {
        return [];
      }
    }

    const messages = getStoredMessages();
    empty.hidden = messages.length !== 0;
    messages.slice().reverse().forEach(function (message) {
      const row = document.createElement('a');
      row.className = 'campusloop-message-row campusloop-message-link';
      row.href = message.productId ? '{{ $.baseUrl }}/product/' + encodeURIComponent(message.productId) : '{{ $.baseUrl }}/';
      row.innerHTML = [
        '<strong></strong>',
        '<span></span>',
        '<small></small>'
      ].join('');
      row.querySelector('strong').textContent = message.product || 'CampusLoop item';
      row.querySelector('span').textContent = message.text || '';
      row.querySelector('small').textContent = message.reply || 'Seller reply pending';
      list.appendChild(row);
    });
  }());
</script>
{{ template "footer" . }}
{{ end }}
