{{ define "messages" }}
{{ template "header" . }}
<main role="main" class="campusloop-dashboard-page">
<section class="campusloop-dashboard-card">
<div class="campusloop-dashboard-header"><div><p class="campusloop-eyebrow">CampusLoop</p><h1>Messages</h1></div><a href="{{ $.baseUrl }}/" class="campusloop-button campusloop-button-secondary">Browse items</a></div>
<p id="chat-status" role="status" aria-live="polite"></p>
<div class="campusloop-inbox">
<nav id="chat-conversations" aria-label="Conversations"></nav>
<section id="chat-thread" hidden><h2 id="chat-title"></h2><a id="chat-item">View item</a><p>Showing the latest 100 messages.</p>
<div id="chat-messages" role="log" aria-live="polite" aria-label="Conversation messages"></div>
<form id="chat-form"><label for="chat-body">Message</label><textarea id="chat-body" maxlength="2000" rows="3" required></textarea><button class="campusloop-button campusloop-button-primary" type="submit">Send</button></form>
</section></div>
</section></main>
<script src="{{ $.baseUrl }}/static/js/chat.js"></script>
{{ template "footer" . }}
{{ end }}
